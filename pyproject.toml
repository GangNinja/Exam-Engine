[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-engine"
version = "0.1.0"
description = "Intelligent Exam Knowledge & Assessment Engine - multi-course ingestion, NLP analysis, question understanding, analytics, a knowledge graph, prerequisite learning paths and coverage-gap detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "SQLAlchemy>=2.0",
    "pdfplumber>=0.11",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "charset-normalizer>=3.0",
    "typer>=0.12",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
neural = ["sentence-transformers>=2.7"]
nlp-spacy = ["spacy>=3.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
exam-engine = "exam_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exam_engine = [
    "storage/migrations/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/exam_engine"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
